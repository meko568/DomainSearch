name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/upload-pages-artifact@v2
        with:
          path: '.'
      
      - uses: actions/deploy-pages@v2
